name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install psutil
        run: python -m pip install --quiet psutil

      - name: Python syntax
        run: python -m py_compile server.py

      - name: Mic-state unit tests
        run: python tests/test_mic_state.py

      - name: Shell syntax
        run: |
          bash -n install.sh
          bash -n uninstall.sh

      - name: Private files must never be committed
        run: |
          if [ -e phrase.txt ]; then
            echo "::error::phrase.txt is personal and must not be committed"
            exit 1
          fi
          if [ -e bin/dictate ] || [ -e bin/typephrase ]; then
            echo "::error::bin/ is build output and must not be committed"
            exit 1
          fi

      - name: The server serves a page and stats
        run: |
          PORT=7788 python3 server.py > /tmp/desknook.log 2>&1 &
          for i in $(seq 1 20); do
            sleep 0.5
            curl -sf -o /dev/null http://localhost:7788/api/stats && break
          done
          curl -sf -o /dev/null http://localhost:7788/ || { cat /tmp/desknook.log; exit 1; }
          curl -sf http://localhost:7788/api/stats | python -c \
            'import json,sys; d=json.load(sys.stdin); assert "cpu" in d and "mem" in d; print("stats ok:", round(d["cpu"],1), "%")'
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:7788/phrase.txt)
          test "$code" = "404" || { echo "phrase.txt should not be served (got $code)"; exit 1; }
          kill %1
